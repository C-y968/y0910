<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ede8df">
<title>Voyage · 旅行分账</title>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
/* preview/tokens.css · 与 miniprogram/styles/tokens.wxss 保持一致
   改这里必须同步改 wxss，反之亦然 */

:root{
  /* 纸基 */
  --paper:#ede8df; --paper-alt:#e4dfd3; --card:#f7f4ef; --white:#fff;
  /* 墨色 */
  --ink:#1c1a17; --ink-mid:#5c5348; --ink-soft:#9a948c; --ink-faint:#c4bbb0;
  --rule:#c4bbb0; --rule-soft:rgba(28,26,23,.14);
  /* 橙 —— 色域，不是点缀 */
  --orange:#b85c3c; --orange-press:#a45032;
  --on-orange:#fdfaf5; --on-orange-soft:rgba(253,250,245,.66);
  --rule-on-orange:rgba(253,250,245,.22);
  /* 语义：应付=赭，应收=墨 */
  --owe:#b85c3c; --owed:#1c1a17; --settled:#9a948c;
  /* 成员色点 */
  --tag-1:#8a6a4f; --tag-2:#5f7a72; --tag-3:#7b6585;
  --tag-4:#8a7442; --tag-5:#6b7285; --tag-6:#87574f;

  --font-mono:"Fragment Mono",ui-monospace,monospace;
  --font-hand:"Homemade Apple",cursive;

  --fs-hero:38px;   /* 页面标题 */
  --fs-total:42px;  /* 唯一主角数字 */
  --fs-amount:16px; /* 账目行金额 */
  --fs-stat:15px;   /* 明细数字 */
  --fs-body:14px; --fs-sub:12px; --fs-label:10px;

  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;
  --sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:52px;
  --pad-x:24px; --r-sm:2px; --r-md:4px; --r-pill:999px;

  --sh-flat:0 2px 4px rgba(80,20,0,.06);
  --sh-card:0 8px 20px rgba(80,20,0,.12);
  --sh-raise:0 12px 28px rgba(80,20,0,.18);

  --ease-out:cubic-bezier(.23,1,.32,1);
  --dur-fast:140ms; --dur-base:240ms; --dur-slow:420ms;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--font-mono);
  font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* 手机框（仅 demo 用，小程序里不需要）*/
.screen{width:390px;min-height:844px;margin:0 auto;max-width:100%;background:var(--paper);
  position:relative;overflow:hidden;padding-bottom:88px}
.grain{position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E")}

/* ── 排版原语 ── */
.label{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.label--on-orange{color:var(--on-orange-soft)}
.label-cn{font-size:var(--fs-label);letter-spacing:.18em;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.05}
.num--total{font-size:var(--fs-total);letter-spacing:-.025em}
.num--amount{font-size:var(--fs-amount)}
.num--stat{font-size:var(--fs-stat)}
.num--owe{color:var(--owe)} .num--owed{color:var(--owed)}
.num--settled{color:var(--settled);text-decoration:line-through}
.cur{font-size:.5em;opacity:.55;margin-right:2px}
.dec{font-size:.62em;opacity:.7}
.hand{font-family:var(--font-hand)}
.text-sub{font-size:var(--fs-sub);color:var(--ink-mid)}
.text-faint{color:var(--ink-soft)}

/* ── 色域块 ── */
.zone-paper{background:var(--paper);padding:var(--sp-8) var(--pad-x) var(--sp-12)}
.zone-orange{background:var(--orange);color:var(--on-orange);
  padding:var(--sp-8) var(--pad-x) var(--sp-6)}
.hero-title{font-size:var(--fs-hero);line-height:1;letter-spacing:-.02em;
  text-transform:uppercase;color:var(--orange);display:block}

/* ── 票据细节 ── */
.perf{height:1px;background-image:repeating-linear-gradient(to right,var(--rule) 0 4px,transparent 4px 9px)}
.rule{height:1px;background:var(--rule-soft)}

/* ── 顶栏 ── */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-6) var(--pad-x) var(--sp-4)}
.topbar__back{font-size:18px;color:var(--ink);width:24px}
.topbar__title{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.topbar__act{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}

/* ── 按钮 ── */
.btn{display:flex;align-items:center;justify-content:center;height:46px;
  border-radius:var(--r-pill);font-size:13px;letter-spacing:.06em;
  font-family:var(--font-mono);border:none;cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(.985)}
.btn--white{background:var(--white);color:var(--orange);box-shadow:var(--sh-card)}
.btn--orange{background:var(--orange);color:var(--on-orange);box-shadow:var(--sh-card)}
.btn--outline{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn--text{background:transparent;color:var(--ink-mid);height:44px}

/* ── 成员色点 ── */
.dot{width:8px;height:8px;border-radius:var(--r-pill);flex-shrink:0;display:inline-block}
.dot--lg{width:10px;height:10px}

/* ── chip ── */
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-pill);border:1px solid var(--rule);background:transparent;
  font-size:var(--fs-sub);font-family:var(--font-mono);color:var(--ink-mid);cursor:pointer;
  transition:all var(--dur-fast) var(--ease-out)}
.chip--on{border-color:var(--orange);background:var(--orange);color:var(--on-orange)}

.badge-cur{font-size:10px;letter-spacing:.12em;padding:3px 6px;border:1px solid var(--rule);
  border-radius:var(--r-sm);color:var(--ink-mid)}

/* ── 账目行 ── */
.expense-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--rule-soft);cursor:pointer}
.expense-row:active{background:var(--paper-alt)}
.expense-row__main{flex:1;min-width:0;overflow:hidden}
.expense-row__name{font-size:var(--fs-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expense-row__meta{font-size:var(--fs-label);letter-spacing:.06em;color:var(--ink-soft);margin-top:3px;
  display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expense-row__amt{flex-shrink:0;text-align:right}
.thumb{width:34px;height:34px;border-radius:var(--r-sm);background:var(--paper-alt);
  box-shadow:var(--sh-flat);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink-faint)}

/* ── 日期分组 ── */
.day-group{margin-bottom:var(--sp-8)}
.day-group__head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:var(--sp-2)}

/* ── 明细统计条 ── */
.stats{display:flex;border-top:1px solid var(--rule-soft)}
.stat{flex:1;padding:var(--sp-4) 0;display:flex;flex-direction:column;gap:var(--sp-2)}
.stat+.stat{border-left:1px solid var(--rule-soft);padding-left:var(--sp-4)}

/* ── 输入 ── */
.field{background:transparent;border:none;border-bottom:1px solid var(--rule);
  padding:var(--sp-3) 0;font-family:var(--font-mono);font-size:var(--fs-body);
  color:var(--ink);width:100%;outline:none}
.field:focus{border-color:var(--orange)}
.field--amount{font-size:48px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  text-align:right;border-bottom:2px solid var(--ink);padding:var(--sp-2) 0}

/* ── 低置信标记（OCR）── */
.uncertain{background:rgba(255,72,0,.08);border-bottom:1px dashed var(--orange)!important}
.uncertain__hint{font-size:var(--fs-label);letter-spacing:.06em;color:var(--orange)}

.empty{padding:var(--sp-12) var(--sp-6);text-align:center;color:var(--ink-soft)}
.sign{display:block;text-align:center;margin-top:var(--sp-10);font-size:17px;color:var(--ink-faint)}

/* ── 底部悬浮记账（tabbar 替代）── */
.fab{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:390px;margin:0 auto;
  padding:var(--sp-4) var(--pad-x) var(--sp-6);
  background:linear-gradient(to top,var(--paper) 60%,rgba(237,232,223,0));z-index:40}

/* ── 动效 ── */
@keyframes reveal-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.reveal{animation:reveal-up var(--dur-slow) var(--ease-out) both}
.reveal--1{animation-delay:60ms}.reveal--2{animation-delay:120ms}.reveal--3{animation-delay:180ms}

/* ==========================================================================
   旅游母题：邮票齿孔 / 邮戳 / 风景线稿
   参照：日本国铁硬券、航空信封边、旧护照落地章
   纪律：全部单色线稿，不引入新颜色；装饰不抢数字
   ========================================================================== */

/* ── 邮票齿孔边 ──
   用 radial-gradient 打半圆缺口，四边齿孔 */
.stamp{
  position:relative;background:var(--card);
  padding:var(--sp-4);
  --pf:7px;   /* 齿孔直径 */
  --pg:11px;  /* 齿距 */
  -webkit-mask:
    radial-gradient(circle var(--pf) at 50% 0,transparent 99%,#000) 0 0/var(--pg) 100% repeat-x,
    radial-gradient(circle var(--pf) at 50% 100%,transparent 99%,#000) 0 100%/var(--pg) 100% repeat-x,
    radial-gradient(circle var(--pf) at 0 50%,transparent 99%,#000) 0 0/100% var(--pg) repeat-y,
    radial-gradient(circle var(--pf) at 100% 50%,transparent 99%,#000) 100% 0/100% var(--pg) repeat-y;
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
}
/* 橙区里的邮票 */
.stamp--on-orange{background:var(--on-orange)}

/* ── 邮戳（圆形印章，盖在角上）── */
.postmark{
  width:62px;height:62px;border-radius:50%;
  border:1.5px solid currentColor;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;opacity:.32;transform:rotate(-11deg);
  flex-shrink:0;pointer-events:none;
}
.postmark__city{font-size:7px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.postmark__line{width:26px;height:1px;background:currentColor;opacity:.6}
.postmark__date{font-size:8px;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1}
.postmark--sm{width:48px;height:48px}
.postmark--sm .postmark__city{font-size:6px}
.postmark--sm .postmark__date{font-size:7px}

/* ── 航空信封斜条边（红蓝改为单色赭）── */
.airmail{
  height:5px;
  background:repeating-linear-gradient(
    -45deg,
    var(--orange) 0 6px,
    transparent 6px 12px,
    var(--ink-faint) 12px 18px,
    transparent 18px 24px
  );
  opacity:.5;
}

/* ── 风景线稿图标（inline svg，currentColor 继承）── */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em;
  fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.ico--lg{width:22px;height:22px;stroke-width:1.2}
.ico--xl{width:34px;height:34px;stroke-width:1}

/* 凭证缩略图改为线稿容器 */
.thumb--ico{display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);background:var(--paper-alt)}

/* ── 票根撕口（左右半圆缺口）── */
.stub{position:relative;background:var(--card);border-radius:var(--r-md)}
.stub::before,.stub::after{
  content:"";position:absolute;top:50%;width:12px;height:12px;
  border-radius:50%;background:var(--paper);transform:translateY(-50%);
}
.stub::before{left:-6px}
.stub::after{right:-6px}

/* ── 目的地缩略风景带（页眉装饰）── */
.skyline{height:40px;color:var(--ink-faint);opacity:.55;
  display:flex;align-items:flex-end;overflow:hidden}
.skyline svg{width:100%;height:100%;fill:none;stroke:currentColor;
  stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.skyline svg use{fill:none;stroke:currentColor}
.skyline--on-orange{color:var(--on-orange);opacity:.28}

/* ══════════ 交互 demo 补充组件 ══════════ */
.hero__row{display:flex;justify-content:space-between;align-items:flex-end}
.hero__mark{width:24px;height:24px;border-radius:var(--r-pill);background:var(--orange);
  display:flex;align-items:center;justify-content:center;color:var(--on-orange)}
.hero__mark .ico{width:13px;height:13px}
.hero{padding:var(--sp-6) var(--pad-x)}
.hero--settle{padding-bottom:var(--sp-8)}
.hero__trip{margin-top:var(--sp-4);font-size:var(--fs-body);color:var(--ink)}
.hero__meta{margin-top:5px;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}

/* 首页进行中卡 */
.act{background:var(--orange);color:var(--on-orange);position:relative;overflow:hidden;
  padding:var(--sp-6) var(--pad-x) 0;cursor:pointer}
.act__top{display:flex;justify-content:space-between;align-items:flex-start}
.act__name{font-size:20px;letter-spacing:-.01em;line-height:1.25}
.act__num{margin-top:var(--sp-5);font-size:32px;letter-spacing:-.025em;line-height:1}
.act__lbl{margin-top:6px;font-size:var(--fs-label);letter-spacing:.12em;
  text-transform:uppercase;color:var(--on-orange-soft)}
.act__foot{margin-top:var(--sp-5);padding-top:var(--sp-3);border-top:1px solid var(--rule-on-orange);
  display:flex;justify-content:space-between;align-items:center}
.act__bal{font-size:var(--fs-sub)}
.act__dots{display:flex;gap:4px}
.act__dots .dot{background:var(--on-orange);opacity:.8}
.act__sky{margin-top:var(--sp-4);height:34px}

.past{padding:var(--sp-8) var(--pad-x) 0}
.past__list{margin-top:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
.pr{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-flat);cursor:pointer}
.pr__ico{color:var(--ink-soft);flex-shrink:0}
.pr__main{flex:1;min-width:0}
.pr__name{font-size:var(--fs-body)}
.pr__meta{font-size:var(--fs-label);letter-spacing:.06em;color:var(--ink-soft);margin-top:2px}
.pr__right{text-align:right;flex-shrink:0}
.pr__amt{font-size:var(--fs-sub);font-variant-numeric:tabular-nums;color:var(--ink-mid)}
.pr__tag{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:1px 4px;margin-top:3px;display:inline-block}

/* 账本概览 */
.ov{background:var(--orange);color:var(--on-orange);position:relative;overflow:hidden;
  padding:var(--sp-5) var(--pad-x) 0}
.ov__top{display:flex;justify-content:space-between;align-items:flex-start}
.ov__name{font-size:19px;letter-spacing:-.01em}
.ov__meta{margin-top:4px}
.ov__num{margin-top:var(--sp-5);font-size:34px;letter-spacing:-.025em;line-height:1}
.ov__row{margin-top:var(--sp-5);padding-top:var(--sp-3);border-top:1px solid var(--rule-on-orange);
  display:flex;gap:var(--sp-4)}
.ov__cell{flex:1;min-width:0}
.ov__cell i{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;
  color:var(--on-orange-soft);font-style:normal;display:block}
.ov__cell b{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  display:block;white-space:nowrap;margin-top:3px;font-weight:400}
.ov__sky{margin-top:var(--sp-4);height:30px}

.tabs{display:flex;gap:var(--sp-2);padding:var(--sp-5) var(--pad-x) 0}
.tl{padding:var(--sp-6) var(--pad-x) 0}
.day__date{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.day__sum{font-size:var(--fs-sub);font-variant-numeric:tabular-nums;color:var(--ink-mid)}
.day__city{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  border:1px solid var(--rule);border-radius:var(--r-sm);padding:1px 4px;margin-left:5px}
.payer{color:var(--ink-mid)}
.src{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.amt2{font-size:var(--fs-label);letter-spacing:.04em;color:var(--ink-soft);
  margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--rule-soft);margin:0 0 var(--sp-2)}
.bar i{display:block;height:100%;background:var(--orange);opacity:.6}

/* 按人视图 */
.mrow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) 0;
  border-bottom:1px solid var(--rule-soft)}
.mrow__main{flex:1;min-width:0}
.mrow__n{font-size:var(--fs-body)}
.mrow__s{font-size:var(--fs-label);letter-spacing:.04em;color:var(--ink-soft);margin-top:2px}
.mrow__net{font-size:15px;flex-shrink:0}

/* 记账页 */
.body{padding:var(--sp-5) var(--pad-x) 0}
.amt{display:flex;align-items:flex-end;gap:var(--sp-3);border-bottom:2px solid var(--ink);
  padding-bottom:var(--sp-3)}
.amt__cur{display:flex;flex-direction:column;gap:2px;padding-bottom:9px;cursor:pointer;flex-shrink:0}
.amt__cur i{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-style:normal}
.amt__cur b{font-size:var(--fs-sub);letter-spacing:.06em;color:var(--ink);
  border-bottom:1px solid var(--rule);padding-bottom:1px;white-space:nowrap;font-weight:400}
.amt__in{flex:1;font-size:38px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  text-align:right;border:none;background:transparent;outline:none;
  font-family:var(--font-mono);color:var(--ink);line-height:1.1;min-width:0;padding:0}
.amt__in::placeholder{color:var(--ink-faint)}
.amt__conv{margin-top:var(--sp-2);text-align:right;font-size:var(--fs-label);
  letter-spacing:.06em;color:var(--ink-soft);min-height:14px}

.ways{display:flex;gap:var(--sp-2);margin-top:var(--sp-6)}
.way{flex:1;aspect-ratio:1;border:1px solid var(--rule);border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all var(--dur-fast) var(--ease-out)}
.way:active{background:var(--paper-alt)}
.way--on{border-color:var(--orange);background:rgba(184,92,60,.07)}
.way__ico{color:var(--ink-soft)}
.way--on .way__ico{color:var(--orange)}
.way__txt{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.way--on .way__txt{color:var(--orange)}

.sec{margin-top:var(--sp-6)}
.sec__hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--sp-3)}
.lnk{color:var(--orange);cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) 0;
  border-bottom:1px solid var(--rule-soft);cursor:pointer}
.row--in{cursor:text}
.row__k{font-size:var(--fs-sub);color:var(--ink-soft);letter-spacing:.04em;flex-shrink:0}
.row__v{font-size:var(--fs-body);display:flex;align-items:center;gap:6px}
.row__v .arw{color:var(--ink-faint);font-size:12px}
.row__in{flex:1;text-align:right;border:none;background:transparent;outline:none;
  font-family:var(--font-mono);font-size:var(--fs-body);color:var(--ink);min-width:0}
.row__in::placeholder{color:var(--ink-faint)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

.split{margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-5);background:var(--card);
  border-radius:var(--r-md);box-shadow:var(--sh-flat)}
.split__row{display:flex;justify-content:space-between;padding:4px 0;font-size:var(--fs-sub)}
.split__note{margin-top:var(--sp-2);padding-top:var(--sp-2);border-top:1px solid var(--rule-soft);
  font-size:var(--fs-label);letter-spacing:.04em;color:var(--orange)}
.note{width:100%;background:transparent;border:none;border-bottom:1px solid var(--rule-soft);
  padding:var(--sp-3) 0;font-family:var(--font-mono);font-size:var(--fs-body);color:var(--ink);outline:none}
.note::placeholder{color:var(--ink-faint)}
.danger{color:var(--orange)}
.is-off{opacity:.3;pointer-events:none}

/* 确认页 */
.shotwrap{position:relative;margin-bottom:var(--sp-5)}
.shot{height:132px;background:var(--paper-alt);display:flex;align-items:center;justify-content:center;
  position:relative;--pf:6px;--pg:10px;
  -webkit-mask:radial-gradient(circle var(--pf) at 50% 0,transparent 99%,#000) 0 0/var(--pg) 100% repeat-x,
    radial-gradient(circle var(--pf) at 50% 100%,transparent 99%,#000) 0 100%/var(--pg) 100% repeat-x,
    radial-gradient(circle var(--pf) at 0 50%,transparent 99%,#000) 0 0/100% var(--pg) repeat-y,
    radial-gradient(circle var(--pf) at 100% 50%,transparent 99%,#000) 100% 0/100% var(--pg) repeat-y;
  -webkit-mask-composite:source-in;mask-composite:intersect}
.shot__ico{color:var(--ink-faint)}
.shot__tag{position:absolute;top:10px;left:12px;font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:var(--r-sm)}
.shot__re{position:absolute;bottom:12px;left:12px;font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;background:rgba(255,255,255,.9);color:var(--ink);padding:4px 8px;border-radius:var(--r-pill)}
.shot__pm{position:absolute;right:10px;bottom:-14px;color:var(--ink-soft);z-index:2;
  background:var(--paper);border-radius:50%}
.heard{padding:var(--sp-4);background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-flat);
  font-size:var(--fs-sub);color:var(--ink-mid);display:flex;gap:var(--sp-2);align-items:flex-start;line-height:1.6}
.heard .ico{flex-shrink:0;margin-top:3px;color:var(--orange)}
.conf{margin-top:var(--sp-5);padding:var(--sp-3) var(--sp-4);background:rgba(184,92,60,.08);
  border-left:2px solid var(--orange)}
.conf--ok{background:var(--paper-alt);border-left-color:var(--rule)}
.conf__t{font-size:var(--fs-sub);color:var(--ink)}
.conf__s{margin-top:3px;font-size:var(--fs-label);letter-spacing:.04em;color:var(--ink-mid);line-height:1.6}
.fields{margin-top:var(--sp-5)}
.f{padding:var(--sp-4) 0;border-bottom:1px solid var(--rule-soft)}
.f__hd{display:flex;justify-content:space-between;align-items:baseline}
.f__k{font-size:var(--fs-label);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.f__badge{font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-sm)}
.f__badge--low{background:var(--orange);color:var(--on-orange)}
.f__badge--ok{color:var(--ink-faint);border:1px solid var(--rule)}
.f__v{margin-top:6px;font-size:17px;font-variant-numeric:tabular-nums}
.f__v--flag{background:rgba(184,92,60,.11);border-bottom:1px dashed var(--orange);
  display:inline-block;padding:1px 4px}
.f__alt{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.f__opt{font-size:var(--fs-label);letter-spacing:.04em;padding:4px 9px;border:1px solid var(--rule);
  border-radius:var(--r-pill);color:var(--ink-mid);cursor:pointer}
.f__opt--on{border-color:var(--orange);background:var(--orange);color:var(--on-orange)}
.items{margin-top:var(--sp-8)}
.item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--rule-soft)}
.item__n{flex:1;font-size:var(--fs-sub);min-width:0}
.item__p{font-size:var(--fs-sub);font-variant-numeric:tabular-nums;color:var(--ink-mid);flex-shrink:0}
.item__who{display:flex;gap:5px;flex-shrink:0}
.item__who .dot{opacity:.22;cursor:pointer;width:10px;height:10px;
  transition:opacity var(--dur-fast) var(--ease-out)}
.item__who .dot--on{opacity:1}
.hint{margin-top:var(--sp-3);font-size:var(--fs-label);letter-spacing:.04em;
  color:var(--ink-soft);line-height:1.7}
.hint--warn{margin-top:var(--sp-4);padding:var(--sp-3) var(--sp-4);background:var(--paper-alt);
  border-radius:var(--r-md);color:var(--ink-mid)}

/* 结算页 */
.band{background:var(--orange);color:var(--on-orange);position:relative;overflow:hidden;
  padding:var(--sp-8) var(--pad-x) 0}
.band__top{display:flex;justify-content:space-between;align-items:flex-start}
.band__total{margin-top:var(--sp-3);font-size:42px;line-height:1;letter-spacing:-.025em}
.band__percap{margin-top:var(--sp-3);font-size:12px;letter-spacing:.06em;color:var(--on-orange-soft)}
.band__sky{margin-top:var(--sp-5);height:30px}
.plan{margin-top:var(--sp-8)}
.plan__head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:var(--sp-3);border-bottom:1px solid var(--rule-on-orange)}
.plan__note{margin-top:var(--sp-4);font-size:12px;letter-spacing:.06em;color:var(--on-orange-soft)}
.plan__btn{margin-top:var(--sp-6)}
.tx__amt{flex:1;text-align:right;font-size:16px}
.foot{padding:var(--sp-8) var(--pad-x) var(--sp-12)}
.stat__num{font-size:15px}
.settle__mark{margin-top:var(--sp-6)}
.foot .perf{margin:var(--sp-8) 0 var(--sp-6)}
.rates{display:flex;flex-direction:column;gap:var(--sp-3)}
.rate{display:flex;align-items:center;gap:var(--sp-3)}
.rate__code{font-size:10px;letter-spacing:.12em;padding:3px 6px;border:1px solid var(--rule);
  border-radius:var(--r-sm);color:var(--ink-mid)}
.rate__val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-mid)}
.rates__hint{margin-top:var(--sp-2);font-size:var(--fs-label);line-height:1.6;color:var(--ink-soft)}

/* toast */
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,8px);
  background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:var(--fs-sub);
  padding:11px 18px;border-radius:var(--r-pill);z-index:60;opacity:0;pointer-events:none;
  transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out);
  box-shadow:var(--sh-raise);max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.topbar__back,.topbar__act{cursor:pointer}
.expense-row,.chip,.way,.row,.act,.pr{-webkit-user-select:none;user-select:none}

/* ══════════════════════════════════════════════════════════
   Voyage · 动效层
   物理约束：纸不弹跳（禁 spring/bounce）。纸会盖章、会翻、会撕。
   参照：邮局盖戳的力道、老式收银机出纸、护照落地章
   ══════════════════════════════════════════════════════════ */

/* ── 1. 邮戳盖章 ──
   保存成功时砸下来。快下落 + 微反弹墨迹 + 停留后淡出 */
@keyframes stamp-slam{
  0%   {opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-26deg)}
  38%  {opacity:1;transform:translate(-50%,-50%) scale(.94) rotate(-9deg)}
  46%  {transform:translate(-50%,-50%) scale(1.04) rotate(-12deg)}
  54%  {transform:translate(-50%,-50%) scale(1) rotate(-11deg)}
  76%  {opacity:1}
  100% {opacity:0;transform:translate(-50%,-50%) scale(1.06) rotate(-11deg)}
}
@keyframes stamp-ink{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  40%{opacity:.14}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}
}
.slam{position:fixed;left:50%;top:38%;z-index:80;pointer-events:none;
  color:var(--orange);animation:stamp-slam 1250ms cubic-bezier(.16,.9,.3,1) both}
.slam__ring{position:absolute;left:50%;top:50%;width:108px;height:108px;border-radius:50%;
  background:var(--orange);animation:stamp-ink 700ms ease-out both}
.slam .postmark{width:92px;height:92px;opacity:.86;border-width:2px;transform:none}
.slam .postmark__city{font-size:11px;letter-spacing:.2em}
.slam .postmark__line{width:44px}
.slam .postmark__date{font-size:12px}
.slam__amt{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);
  font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;color:var(--ink);
  white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── 2. 页面转场：纸张推入 ── */
@keyframes page-in{
  from{opacity:0;transform:translateX(14px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes page-back{
  from{opacity:0;transform:translateX(-14px)}
  to{opacity:1;transform:translateX(0)}
}
.pg-fwd>*{animation:page-in 300ms var(--ease-out) both}
.pg-back>*{animation:page-back 300ms var(--ease-out) both}

/* ── 3. 数字滚动位（count-up 由 JS 驱动，这里只给微光）── */
@keyframes num-tick{
  0%{opacity:.55}
  100%{opacity:1}
}
.ticking{animation:num-tick 120ms linear}

/* ── 4. chip 墨点扩散 ── */
.chip{position:relative;overflow:hidden}
@keyframes ink-spread{
  from{transform:translate(-50%,-50%) scale(0);opacity:.32}
  to{transform:translate(-50%,-50%) scale(2.6);opacity:0}
}
.ink{position:absolute;width:70px;height:70px;border-radius:50%;
  background:var(--orange);pointer-events:none;
  animation:ink-spread 480ms var(--ease-out) both}
.chip--on .ink{background:var(--on-orange)}

/* ── 5. 账目行：按下时纸张下压 ── */
.expense-row{transition:transform var(--dur-fast) var(--ease-out),
  background var(--dur-fast) var(--ease-out)}
.expense-row:active{transform:translateX(3px);background:var(--paper-alt)}

/* 新增行落下 */
@keyframes row-drop{
  0%{opacity:0;transform:translateY(-10px);max-height:0}
  100%{opacity:1;transform:translateY(0);max-height:120px}
}
.row-new{animation:row-drop 420ms var(--ease-out) both}

/* ── 6. 结算：票据撕开 + 逐行落下 ── */
@keyframes tear{
  0%{clip-path:inset(0 0 100% 0)}
  100%{clip-path:inset(0 0 0 0)}
}
.band{animation:tear 620ms cubic-bezier(.3,.8,.2,1) both}
@keyframes tx-land{
  0%{opacity:0;transform:translateY(-7px)}
  70%{opacity:1}
  100%{opacity:1;transform:translateY(0)}
}
.tx{animation:tx-land 380ms var(--ease-out) both}
.tx:nth-child(2){animation-delay:180ms}
.tx:nth-child(3){animation-delay:270ms}
.tx:nth-child(4){animation-delay:360ms}
.tx:nth-child(5){animation-delay:450ms}
.tx:nth-child(6){animation-delay:540ms}
.plan__note{animation:tx-land 380ms var(--ease-out) 640ms both}

/* ── 7. 天际线：缓慢横移（列车窗外）── */
@keyframes drift{
  from{transform:translateX(0)}
  to{transform:translateX(-24px)}
}
.skyline svg{animation:drift 26s linear infinite alternate}

/* ── 8. 语音波形 ── */
.wave{display:flex;align-items:center;gap:3px;height:22px}
.wave i{width:2px;background:var(--orange);border-radius:1px;
  animation:wv 900ms ease-in-out infinite}
@keyframes wv{
  0%,100%{height:4px;opacity:.4}
  50%{height:20px;opacity:1}
}
.wave i:nth-child(1){animation-delay:0ms}
.wave i:nth-child(2){animation-delay:110ms}
.wave i:nth-child(3){animation-delay:220ms}
.wave i:nth-child(4){animation-delay:80ms}
.wave i:nth-child(5){animation-delay:300ms}
.wave i:nth-child(6){animation-delay:160ms}
.wave i:nth-child(7){animation-delay:240ms}
.wave i:nth-child(8){animation-delay:40ms}
.wave i:nth-child(9){animation-delay:280ms}

/* 录音浮层 */
.rec{position:fixed;inset:0;z-index:70;background:rgba(28,26,23,.42);
  display:flex;align-items:center;justify-content:center;
  animation:fade-in 200ms var(--ease-out) both}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.rec__card{background:var(--paper);padding:var(--sp-8) var(--sp-6);border-radius:var(--r-md);
  box-shadow:var(--sh-raise);text-align:center;width:250px;
  animation:page-in 260ms var(--ease-out) both}
.rec__t{font-size:var(--fs-label);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:var(--sp-5)}
.rec__wave{justify-content:center;margin-bottom:var(--sp-5)}
.rec__hint{font-size:var(--fs-sub);color:var(--ink-mid);line-height:1.7;min-height:42px}
.rec__cap{margin-top:var(--sp-5);font-size:var(--fs-label);letter-spacing:.08em;color:var(--ink-faint)}

/* ── 9. OCR 扫描线 ── */
@keyframes scan{
  0%{top:0;opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{top:100%;opacity:0}
}
.scanning::after{content:"";position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(to right,transparent,var(--orange),transparent);
  animation:scan 1100ms ease-in-out infinite;z-index:3}

/* 字段逐个确认落位 */
@keyframes fld-in{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:translateY(0)}
}
.f{animation:fld-in 300ms var(--ease-out) both}
.f:nth-child(2){animation-delay:70ms}
.f:nth-child(3){animation-delay:140ms}
.f:nth-child(4){animation-delay:210ms}

/* 低置信字段呼吸 */
@keyframes flag-pulse{
  0%,100%{background:rgba(184,92,60,.09)}
  50%{background:rgba(184,92,60,.19)}
}
.f__v--flag{animation:flag-pulse 2.4s ease-in-out infinite}

/* ── 10. 逐项分账色点：点亮时墨点跳一下 ── */
@keyframes dot-pop{
  0%{transform:scale(1)}
  40%{transform:scale(1.5)}
  100%{transform:scale(1)}
}
.dot-pop{animation:dot-pop 260ms var(--ease-out)}

/* ── 11. 归档：票据撕裂并飘走 ── */
@keyframes archive-away{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(-34px) rotate(-3deg)}
}
.archiving{animation:archive-away 620ms cubic-bezier(.4,0,.7,.2) both}

/* ── 12. 首页卡片进场 ── */
@keyframes card-rise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.act{animation:card-rise 420ms var(--ease-out) both}
.pr{animation:card-rise 380ms var(--ease-out) both}
.pr:nth-child(2){animation-delay:80ms}
.pr:nth-child(3){animation-delay:160ms}

/* ── 13. 里程彩蛋（连点罗盘）── */
.compass-spin{animation:spin 900ms cubic-bezier(.3,.8,.2,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hero__mark{cursor:pointer;transition:transform var(--dur-fast) var(--ease-out)}
.hero__mark:active{transform:scale(.9)}

.egg{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:var(--sp-4) var(--sp-5);z-index:75;box-shadow:var(--sh-raise);
  opacity:0;transition:all 380ms var(--ease-out);max-width:280px;pointer-events:none}
.egg.on{opacity:1;transform:translateX(-50%) translateY(0)}
.egg__t{font-size:var(--fs-label);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:var(--sp-2)}
.egg__n{font-family:var(--font-mono);font-size:26px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--orange);line-height:1}
.egg__s{margin-top:var(--sp-2);font-size:var(--fs-sub);color:var(--ink-mid);line-height:1.6}

/* ── 14. FAB 按下 ── */
.fab .btn{transition:transform var(--dur-fast) var(--ease-out),
  box-shadow var(--dur-fast) var(--ease-out)}
.fab .btn:active{transform:translateY(1px) scale(.99);box-shadow:var(--sh-flat)}

/* ── 15. 保存按钮就绪时的微光 ── */
@keyframes ready{
  0%,100%{box-shadow:var(--sh-card)}
  50%{box-shadow:0 8px 24px rgba(184,92,60,.3)}
}
.btn--ready{animation:ready 2.2s ease-in-out infinite}

/* ── 16. 长按记账：环形进度 ── */
.hold{position:absolute;inset:-3px;border-radius:var(--r-pill);pointer-events:none}
.hold circle{fill:none;stroke:var(--on-orange);stroke-width:2;opacity:.55;
  stroke-dasharray:1000;stroke-dashoffset:1000;
  transition:stroke-dashoffset 620ms linear}
.holding circle{stroke-dashoffset:0}

/* 减弱动效偏好 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

<script>
/* Voyage · 交互 demo 逻辑 · part 1：内核 + 数据 + 状态 */

/* ═══ 清算内核（与 miniprogram/utils/settle.js 同源）═══ */
function computeNet(members, expenses){
  const net={}; members.forEach(m=>net[m.id]=0);
  expenses.forEach(e=>{
    e.payers.forEach(p=>{ if(net[p.memberId]!==undefined) net[p.memberId]+=p.amount });
    e.splits.forEach(s=>{ if(net[s.memberId]!==undefined) net[s.memberId]-=s.amount });
  });
  return net;
}
function settle(net){
  const cred=[],deb=[];
  Object.keys(net).forEach(id=>{const v=net[id];
    if(v>0)cred.push({id,amount:v}); else if(v<0)deb.push({id,amount:-v})});
  const out=[]; let g=0;
  while(cred.length&&deb.length){
    if(++g>10000) throw new Error('loop guard');
    cred.sort((a,b)=>b.amount-a.amount); deb.sort((a,b)=>b.amount-a.amount);
    const c=cred[0],d=deb[0],amt=Math.min(c.amount,d.amount);
    out.push({from:d.id,to:c.id,amount:amt});
    c.amount-=amt; d.amount-=amt;
    if(!c.amount)cred.shift(); if(!d.amount)deb.shift();
  }
  return out;
}
function splitEqually(total, ids, remainderTo){
  const n=ids.length; if(!n)return [];
  const base=Math.floor(total/n); let rem=total-base*n;
  const target=ids.indexOf(remainderTo)>=0?remainderTo:ids[0];
  return ids.map(id=>{let a=base; if(id===target&&rem>0){a+=rem;rem=0} return {memberId:id,amount:a}});
}
const fmt=c=>{const neg=c<0,v=Math.abs(c);
  return (neg?'-':'')+(v/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')};
const fmtInt=c=>fmt(c).split('.')[0];
const fmtDec=c=>fmt(c).split('.')[1];

/* ═══ 数据 ═══ */
const RATES={CNY:1,JPY:0.0492,USD:7.12,THB:0.198,EUR:7.78,HKD:0.912};
const CAT=[
  {id:'food',name:'餐饮',ico:'i-ramen'},{id:'stay',name:'住宿',ico:'i-onsen'},
  {id:'move',name:'交通',ico:'i-train'},{id:'fly',name:'机票',ico:'i-plane'},
  {id:'play',name:'门票',ico:'i-ticket'},{id:'shop',name:'购物',ico:'i-shop'},
  {id:'taxi',name:'打车',ico:'i-taxi'},{id:'other',name:'其他',ico:'i-tag'},
];
const catOf=id=>CAT.find(c=>c.id===id)||CAT[7];

function mk(id,name,cat,at,cur,amtOrig,payer,parts,src,paidOn){
  const base=cur==='CNY'?amtOrig:Math.round(amtOrig*RATES[cur]);
  return {id,name,cat,at,cur,amtOrig,rate:RATES[cur],amount:base,
    payers:[{memberId:payer,amount:base}],
    splits:splitEqually(base,parts,payer),src,paidOn:paidOn||'',note:''};
}
const MB=(i,n,c)=>({id:i,name:n,color:c});
const DB={trips:[
  {id:'t1',name:'东京 5 日',city:'Tokyo',base:'CNY',sym:'¥',
   from:'2026-09-02',to:'2026-09-06',archived:false,

     mk('e5','小田急浪漫号','move','2026-09-04T09:20','CNY',85200,'wang',['me','li','wang','zhang'],''),
     mk('e6','CA167 · PVG→NRT ×4','fly','2026-09-02T08:00','CNY',451400,'me',['me','li','wang','zhang'],'shot','2026-07-28'),
   ]},

  {id:'t3',name:'清迈',city:'Chiang Mai',base:'CNY',sym:'¥',

]};

/* ═══ 状态 ═══ */
let S={route:'home',tripId:'t1',editing:null,toast:'',tab:'time'};
const trip=()=>DB.trips.find(t=>t.id===S.tripId);
var go=(r,p={})=>{Object.assign(S,{route:r},p); window.scrollTo(0,0); render()};
var toast=function(msg){S.toast=msg; render();
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>{S.toast='';render()},1900)}

/* ═══ 计算 ═══ */
function stats(t){
  const total=t.expenses.reduce((s,e)=>s+e.amount,0);
  const per=t.members.length?Math.round(total/t.members.length):0;
  const net=computeNet(t.members,t.expenses);
  const paid=t.expenses.reduce((s,e)=>s+e.payers.filter(p=>p.memberId==='me').reduce((x,p)=>x+p.amount,0),0);
  const share=t.expenses.reduce((s,e)=>s+e.splits.filter(x=>x.memberId==='me').reduce((x,y)=>x+y.amount,0),0);
  return {total,per,net,paid,share,mine:net['me']||0,tx:settle(net)};
}
const nameOf=(t,id)=>(t.members.find(m=>m.id===id)||{}).name||'?';
const colorOf=(t,id)=>(t.members.find(m=>m.id===id)||{}).color||'var(--ink-soft)';
const DD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dLabel=iso=>{const d=new Date(iso);
  return `${MM[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')} · ${DD[d.getDay()]}`};
const md=iso=>{const d=new Date(iso);
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
const days=(a,b)=>Math.ceil((new Date(b)-new Date(a))/864e5)+1;

const sky=cls=>`<div class="skyline ${cls}"><svg><use href="#i-skyline"/></svg></div>`;
const money=(sym,c)=>`<span class="cur">${sym}</span>${fmtInt(c)}<span class="dec">.${fmtDec(c)}</span>`;

/* part 2：首页 + 账本 */

function row(t,e){
  const pid=e.payers[0].memberId;
  const inSplit=e.splits.some(s=>s.memberId===pid);
  return `<div class="expense-row" data-go="edit" data-id="${e.id}">

        ${e.src?` · <span class="src">${e.src}</span>`:''}
      </div>
    </div>
    <div class="expense-row__amt">
      <div class="num num--amount"><span class="cur">${t.sym}</span>${fmt(e.amount)}</div>

function vTrip(){
  const t=trip(), st=stats(t), span=days(t.from,t.to);
  const dn=Math.min(Math.max(Math.ceil((Date.now()-new Date(t.from))/864e5),1),span);
  let list='';

  if(S.tab==='time'){
    const g={};
    [...t.expenses].sort((a,b)=>b.at.localeCompare(a.at))
      .forEach(e=>{const k=e.at.slice(0,10); (g[k]=g[k]||[]).push(e)});
    list=Object.keys(g).sort().reverse().map(k=>{
      const sum=g[k].reduce((s,e)=>s+e.amount,0);
      return `<div class="day-group">
        <div class="day-group__head">
          <span class="day__date">${dLabel(k)}</span>
          <span class="day__sum">${t.sym}${fmt(sum)}</span></div>
        ${g[k].map(e=>row(t,e)).join('')}</div>`}).join('');
  } else if(S.tab==='cat'){
    const g={}; t.expenses.forEach(e=>{(g[e.cat]=g[e.cat]||[]).push(e)});
    list=Object.keys(g).sort((a,b)=>
      g[b].reduce((s,e)=>s+e.amount,0)-g[a].reduce((s,e)=>s+e.amount,0)).map(c=>{
      const sum=g[c].reduce((s,e)=>s+e.amount,0);
      const pct=st.total?Math.round(sum/st.total*100):0;
      return `<div class="day-group">
        <div class="day-group__head">
          <div><span class="day__date">${catOf(c).name}</span><span class="day__city">${pct}%</span></div>
          <span class="day__sum">${t.sym}${fmt(sum)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        ${g[c].map(e=>row(t,e)).join('')}</div>`}).join('');
  } else {
    list=`<div class="day-group">${t.members.map(m=>{
      const paid=t.expenses.reduce((s,e)=>s+e.payers.filter(p=>p.memberId===m.id).reduce((x,p)=>x+p.amount,0),0);
      const sh=t.expenses.reduce((s,e)=>s+e.splits.filter(x=>x.memberId===m.id).reduce((x,y)=>x+y.amount,0),0);
      const n=st.net[m.id]||0;
      return `<div class="mrow">
        <span class="dot dot--lg" style="background:${m.color}"></span>
        <div class="mrow__main"><div class="mrow__n">${m.name}</div>
        <div class="mrow__s">垫付 ${t.sym}${fmt(paid)} · 应摊 ${t.sym}${fmt(sh)}</div></div>
        <span class="num mrow__net ${n>=0?'num--owed':'num--owe'}">${n>=0?'+':'−'}${t.sym}${fmt(Math.abs(n))}</span>
      </div>`}).join('')}</div>`;
  }

  return `
  <div class="topbar">
    <span class="topbar__back" data-go="home">←</span>
    <span class="topbar__title">Ledger</span>
    <span class="topbar__act" data-go="settle">结算</span>
  </div>
  <div class="airmail"></div>
  <div class="ov">
    <div class="ov__top">
      <div><div class="ov__name">${t.name}</div>
      <div class="label label--on-orange ov__meta">${md(t.from)} — ${md(t.to)} · ${t.members.length} PAX · DAY ${dn}</div></div>
      ${pm(t.city,md(t.to),'postmark--sm','var(--on-orange)')}
    </div>
    <div class="num ov__num">${money(t.sym,st.total)}</div>

      <div class="ov__cell"><i>人均</i><b>${t.sym}${fmt(st.per)}</b></div>
      <div class="ov__cell"><i>我垫付</i><b>${t.sym}${fmt(st.paid)}</b></div>
      <div class="ov__cell"><i>我${st.mine>=0?'应收':'应付'}</i><b>${t.sym}${fmt(Math.abs(st.mine))}</b></div>

    `<div class="chip ${S.tab===k?'chip--on':''}" data-tab="${k}">${n}</div>`).join('')}</div>
  <div class="tl">${list||'<div class="empty">还没有账目<br>点下方按钮记第一笔</div>'}</div>`;
}

/* part 3：记一笔 + 识别确认 */

const CURS=['CNY','JPY','USD','THB','EUR','HKD'];

function centsOf(d,t){
  const c=Math.round(parseFloat(String(d.amountStr).replace(/,/g,'')||0)*100)||0;
  return {orig:c, base:d.cur===t.base?c:Math.round(c*RATES[d.cur])};
}
function splitsOf(d,base){
  return d.mode==='eq'?splitEqually(base,d.parts,d.payer)
    :d.custom.filter(s=>d.parts.includes(s.memberId));
}
function remNote(t,base,d){
  if(d.mode!=='eq'||!d.parts.length)return '';
  const n=d.parts.length, r=base-Math.floor(base/n)*n;
  if(!r)return '';
  const inP=d.parts.includes(d.payer);
  const tgt=inP?d.payer:d.parts[0];
  return `<div class="split__note">除不尽的 ${t.sym}${fmt(r)} 归${inP?'付款人':''}「${nameOf(t,tgt)}」</div>`;
}
function splitBox(t,d){
  const {base}=centsOf(d,t);
  if(!base||!d.parts.length)return '';
  const sp=splitsOf(d,base);
  return sp.map(s=>`<div class="split__row"><span>${nameOf(t,s.memberId)}</span>
    <span class="num">${t.sym}${fmt(s.amount)}</span></div>`).join('')+remNote(t,base,d);
}

    <div class="ways">
      ${[['i-keyboard','手动','manual'],['i-receipt','小票','ocr'],
         ['i-screenshot','截图','shot'],['i-mic','语音','voice']].map(([i,n,k])=>
        `<div class="way ${d.src===k?'way--on':''}" data-way="${k}">
          ${ico(i,'ico ico--lg way__ico')}<span class="way__txt">${n}</span></div>`).join('')}
    </div>

    <div class="sec">
      <label class="row row--in">
        <span class="row__k">项目</span>
        <input class="row__in" id="nameIn" value="${d.name}" placeholder="点此输入">
      </label>
      <div class="row" data-act="cycle-cat">
        <span class="row__k">类目</span>
        <span class="row__v">${ico(catOf(d.cat).ico)} ${catOf(d.cat).name} <span class="arw">›</span></span>
      </div>
      <div class="row">
        <span class="row__k">时间</span>
        <span class="row__v text-faint">${d.at.slice(5,10).replace('-','.')} ${d.at.slice(11,16)}</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec__hd"><span class="label">Paid by</span></div>
      <div class="chips">${t.members.map(m=>
        `<div class="chip ${d.payer===m.id?'chip--on':''}" data-payer="${m.id}">
          <span class="dot" style="background:${d.payer===m.id?'var(--on-orange)':m.color}"></span>${m.name}</div>`).join('')}
      </div>
    </div>

    <div class="sec">
      <div class="sec__hd">
        <span class="label">Split between · ${d.parts.length}</span>
        <span class="label lnk" data-act="toggle-mode">${d.mode==='eq'?'均摊':'自定义'} ▾</span>
      </div>
      <div class="chips">${t.members.map(m=>{const on=d.parts.includes(m.id);
        return `<div class="chip ${on?'chip--on':''}" data-part="${m.id}">
          <span class="dot" style="background:${on?'var(--on-orange)':m.color}"></span>${m.name}</div>`}).join('')}
      </div>
      <div class="split" ${base&&d.parts.length?'':'hidden'}>${splitBox(t,d)}</div>
    </div>

    <div class="sec">
      <input class="note" id="noteIn" value="${d.note||''}" placeholder="备注（可选）">

document.addEventListener('click',e=>{
  const pick=k=>e.target.closest(`[${k}]`);
  let x, t=trip();

  if(x=pick('data-tab')){S.tab=x.dataset.tab; return render()}

  if(x=pick('data-go')){
    const r=x.dataset.go;
    if(r==='trip'&&x.dataset.id){S.tripId=x.dataset.id; return go('trip')}
    if(r==='edit'){
      const ex=t.expenses.find(y=>y.id===x.dataset.id);
      S.editing={id:ex.id,name:ex.name,cat:ex.cat,cur:ex.cur,amountStr:fmt(ex.amtOrig),
        payer:ex.payers[0].memberId,parts:ex.splits.map(s=>s.memberId),
        mode:'eq',custom:ex.splits,at:ex.at,src:ex.src||'manual',note:ex.note||''};
      return go('add');
    }
    if(r==='add'){return go('add')}
    return go(r);
  }

  if(x=pick('data-way')){
    if(S.route==='add')syncInputs();
    const k=x.dataset.way; S.editing.src=k;
    return k==='manual'?render():go('confirm');
  }
  if(x=pick('data-payer')){syncInputs(); S.editing.payer=x.dataset.payer; return render()}
  if(x=pick('data-part')){
    syncInputs();
    const p=S.editing.parts, i=p.indexOf(x.dataset.part);
    i>=0?p.splice(i,1):p.push(x.dataset.part);
    return render();
  }
  if(x=pick('data-item')){
    const o=MOCK[S.editing.src]||MOCK.ocr, it=o.items[+x.dataset.item], m=x.dataset.mid;
    const i=it[2].indexOf(m); i>=0?it[2].splice(i,1):it[2].push(m);
    return render();
  }

  if(!(x=pick('data-act')))return;
  const a=x.dataset.act;

  if(a==='new-trip')return toast('Demo 固定三个行程，新建流程未接');
  if(a==='new-exp'){S.editing=blankExp(); return go('add')}
  if(a==='cycle-cur'){syncInputs();
    S.editing.cur=CURS[(CURS.indexOf(S.editing.cur)+1)%CURS.length]; return render()}
  if(a==='cycle-cat'){syncInputs();
    S.editing.cat=CAT[(CAT.findIndex(c=>c.id===S.editing.cat)+1)%CAT.length].id; return render()}
  if(a==='toggle-mode'){
    syncInputs(); const d=S.editing;
    d.mode=d.mode==='eq'?'custom':'eq';
    if(d.mode==='custom'){
      const {base}=centsOf(d,t);
      d.custom=splitEqually(base,d.parts,d.payer);
      toast('自定义分账：demo 沿用当前数值');
    }
    return render();
  }
  if(a==='save'){
    syncInputs();
    const d=S.editing, {orig,base}=centsOf(d,t);
    if(!base)return toast('先填金额');
    if(!d.parts.length)return toast('至少选一个分账人');
    const obj={id:d.id||'x'+Date.now(),name:d.name||catOf(d.cat).name,cat:d.cat,at:d.at,
      cur:d.cur,amtOrig:orig,rate:RATES[d.cur],amount:base,
      payers:[{memberId:d.payer,amount:base}],splits:splitsOf(d,base),
      src:d.src==='manual'?'':d.src,paidOn:'',note:d.note};
    if(d.id){t.expenses[t.expenses.findIndex(y=>y.id===d.id)]=obj}
    else t.expenses.unshift(obj);
    go('trip'); return toast(d.id?'已更新':`已记 ${t.sym}${fmt(base)}`);
  }
  if(a==='del'){
    t.expenses.splice(t.expenses.findIndex(y=>y.id===S.editing.id),1);
    go('trip'); return toast('已删除');
  }
  if(a==='accept'){
    const o=MOCK[S.editing.src]||MOCK.ocr;
    Object.assign(S.editing,{name:o.name,cat:o.cat,cur:o.cur,amountStr:o.amountStr});
    go('add'); return toast('已填入，确认后保存');
  }
  if(a==='retry')return toast('重新识别（demo 未接相机）');
  if(a==='share'){
    const st=stats(t);
    const txt=[`【${t.name}】总支出 ${t.sym}${fmt(st.total)}，人均 ${t.sym}${fmt(st.per)}`,
      ...st.tx.map(y=>`${nameOf(t,y.from)} → ${nameOf(t,y.to)}    ${t.sym}${fmt(y.amount)}`),
      `共 ${st.tx.length} 笔转账即可结清`].join('\n');
    if(navigator.clipboard)navigator.clipboard.writeText(txt)
      .then(()=>toast('已复制，可粘贴到群里')).catch(()=>alert(txt));
    else alert(txt);
    return;
  }
  if(a==='mark'){
    if(t.archived)return toast('这个行程已归档');
    if(confirm('确认所有转账都已完成？\n标记后账本进入归档状态。')){
      t.archived=true; go('home'); return toast('已归档');
    }
  }
});

const buzz=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ── 数字滚动 ── */
function countUp(el,to,sym,dur=520){
  const from=0, t0=performance.now();
  const ease=x=>1-Math.pow(1-x,3);
  function step(t){
    const p=Math.min((t-t0)/dur,1);
    const v=Math.round(from+(to-from)*ease(p));
    el.innerHTML=`<span class="cur">${sym}</span>${fmtInt(v)}<span class="dec">.${fmtDec(v)}</span>`;
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function animateBigNums(){
  document.querySelectorAll('.act__num,.ov__num,.band__total').forEach(el=>{
    const raw=el.textContent.replace(/[^\d.]/g,'');
    const cents=Math.round(parseFloat(raw||0)*100);
    const sym=el.textContent.trim().charAt(0);
    if(cents>0)countUp(el,cents,sym);
  });
}

function ink(el,ev){

  const s=document.createElement('span');

  s.style.left=((ev.clientX||r.left+r.width/2)-r.left)+'px';
  s.style.top=((ev.clientY||r.top+r.height/2)-r.top)+'px';
  el.appendChild(s);
  setTimeout(()=>s.remove(),500);
}

  }
};

/* ── 保存/归档时盖章 ── */
const _toast=toast;
toast=function(msg){
  const t=trip();
  if(/^已记 /.test(msg)){slam(t.city,md(new Date().toISOString()),msg.replace('已记 ','')); return}
  if(msg==='已更新'){slam('Amended',md(new Date().toISOString()),''); return}
  if(msg==='已归档'){slam('Settled',md(t.to),t.name); return}
  _toast(msg);
};

render();

</script>
